<form [formGroup]="form" (ngSubmit)="guardar()">
  @if (error) {
    <p-message severity="error" styleClass="mb-3" [text]="error" />
  }

  <div class="campo">
    <label for="actual">Contraseña actual</label>
    <p-password inputId="actual" formControlName="actual" [feedback]="false" [toggleMask]="true"
      autocomplete="current-password" [maxlength]="72" styleClass="w-full" inputStyleClass="w-full" [autofocus]="true" />
    <app-error-campo [control]="form.controls.actual" />
  </div>
  <div class="campo">
    <label for="nueva">Contraseña nueva <span class="secundario">(mínimo {{ contrasenaMinimo }} caracteres)</span></label>
    <p-password inputId="nueva" formControlName="nueva" [feedback]="false" [toggleMask]="true"
      autocomplete="new-password" [maxlength]="72" styleClass="w-full" inputStyleClass="w-full" />
    <app-error-campo [control]="form.controls.nueva" />
  </div>
  <div class="campo">
    <label for="confirmacion">Confirmar contraseña nueva</label>
    <p-password inputId="confirmacion" formControlName="confirmacion" [feedback]="false" [toggleMask]="true"
      autocomplete="new-password" [maxlength]="72" styleClass="w-full" inputStyleClass="w-full" />
    <app-error-campo [control]="form.controls.confirmacion" />
  </div>

  <p class="secundario mt-0">
    Se cerrarán sus sesiones en otros equipos (esta sigue abierta) y le llegará un aviso a su correo.
  </p>

  <div class="flex justify-content-end gap-2 mt-3">
    <p-button label="Cancelar" severity="secondary" [text]="true" [disabled]="guardando" (onClick)="cancel.emit()" />
    <p-button type="submit" label="Guardar" icon="pi pi-check" [loading]="guardando" />
  </div>
</form>
