<p class="mt-0 mb-3 secundario">{{ usuario.nombre }} · {{ usuario.correo }}</p>

<div class="grid">
  <div class="col-12 md:col-4">
    <button type="button" class="action-card" [disabled]="!esPsicologo" (click)="clientes.emit(usuario)">
      <i class="pi pi-building action-icon text-blue-500"></i>
      <h3>Clientes asignados</h3>
      <p>{{ esPsicologo ? 'Empresas cuyas personas e informes ve.' : 'Solo para psicólogos.' }}</p>
    </button>
  </div>

  <div class="col-12 md:col-4">
    <button type="button" class="action-card" (click)="editar.emit(usuario)">
      <i class="pi pi-pencil action-icon text-orange-500"></i>
      <h3>Editar datos</h3>
      <p>Usuario, nombre, rol, vínculo y estado.</p>
    </button>
  </div>

  <div class="col-12 md:col-4">
    <button type="button" class="action-card" [disabled]="!!motivoSinEnlace" (click)="enlace.emit(usuario)">
      <i class="pi pi-envelope action-icon text-green-500"></i>
      <h3>Enlace de contraseña</h3>
      <p>{{ motivoSinEnlace ?? 'Enviarle por correo un enlace para definir su contraseña.' }}</p>
    </button>
  </div>
</div>
