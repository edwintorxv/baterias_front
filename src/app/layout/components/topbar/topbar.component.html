<header class="topbar">
  <p-button icon="pi pi-bars" [text]="true" [rounded]="true" (onClick)="openMenu()" pTooltip="Menú" />

  <div class="flex-1"></div>

  @if (usuariosPrueba.length) {
    <p-tag value="DESARROLLO" severity="warn" />
    <p-select
      [options]="usuariosPrueba"
      optionLabel="etiqueta"
      optionValue="usuario"
      [ngModel]="usuario()?.usuario"
      (ngModelChange)="cambiarUsuario($event)"
      [disabled]="cambiando"
      placeholder="Usuario de prueba"
      size="small"
      styleClass="selector-usuario" />
  }

  @if (usuario(); as u) {
    <button type="button" class="usuario" (click)="menuUsuario.toggle($event)" aria-haspopup="true"
      aria-label="Opciones del usuario">
      <span class="datos">
        <span class="nombre">{{ u.nombre }}</span>
        <span class="rol">{{ rol() }}</span>
      </span>
      <i class="pi pi-angle-down"></i>
    </button>
    <p-menu #menuUsuario [model]="opcionesUsuario" [popup]="true" appendTo="body" />
  }

  <p-button
    [icon]="themeService.tema() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'"
    [text]="true"
    [rounded]="true"
    (onClick)="themeService.toggle()"
    pTooltip="Cambiar tema" />
</header>
