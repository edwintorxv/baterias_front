<div class="pagina">
  <div class="caja">
    <div class="marca">
      <i class="pi pi-shield"></i>
      <div>
        <h1>Batería de Riesgo Psicosocial</h1>
        <span class="secundario">Ingrese con su usuario</span>
      </div>
    </div>

    @if (sesionTerminada && !error) {
      <p-message severity="info" styleClass="mb-3" text="Su sesión terminó. Vuelva a ingresar." />
    }
    @if (error) {
      <p-message severity="error" styleClass="mb-3" [text]="error" />
    }

    <form [formGroup]="form" (ngSubmit)="ingresar()">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input pInputText id="usuario" formControlName="usuario" autocomplete="username" autocapitalize="none"
          maxlength="50" autofocus />
        <app-error-campo [control]="form.controls.usuario" />
      </div>
      <div class="campo">
        <label for="contrasena">Contraseña</label>
        <p-password inputId="contrasena" formControlName="contrasena" [feedback]="false" [toggleMask]="true"
          autocomplete="current-password" [maxlength]="100" styleClass="w-full" inputStyleClass="w-full" />
        <app-error-campo [control]="form.controls.contrasena" />
      </div>
      <p-button type="submit" label="Ingresar" icon="pi pi-sign-in" iconPos="right" [loading]="ingresando"
        styleClass="w-full mt-2" />
    </form>

    @if (usuariosPrueba.length) {
      <div class="desarrollo">
        <span class="secundario">Desarrollo: entrar como</span>
        <div class="botones">
          @for (prueba of usuariosPrueba; track prueba.usuario) {
            <p-button [label]="prueba.etiqueta" size="small" severity="secondary" [outlined]="true"
              [disabled]="ingresando" (onClick)="entrarComo(prueba)" />
          }
        </div>
      </div>
    }
  </div>

  <p-button [icon]="themeService.tema() === 'dark' ? 'pi pi-sun' : 'pi pi-moon'" [text]="true" [rounded]="true"
    (onClick)="themeService.toggle()" ariaLabel="Cambiar tema" styleClass="tema" />
</div>
